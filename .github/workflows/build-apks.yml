name: Build One UI 9 Home & Home Up APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Build APKs
        run: gradle :oneuihome:assembleDebug :homeup:assembleDebug --no-daemon

      - name: Upload Compiled APKs
        uses: actions/upload-artifact@v4
        with:
          name: OneUI9-Home-and-HomeUp-APKs
          path: |
            oneuihome/build/outputs/apk/debug/*.apk
            homeup/build/outputs/apk/debug/*.apk
