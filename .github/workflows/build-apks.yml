name: Build One UI 9 Home & Home Up APKs

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build One UI 9 Home and Home Up APKs
        run: gradle :oneuihome:assembleDebug :homeup:assembleDebug

      - name: Upload Compiled APKs
        uses: actions/upload-artifact@v4
        with:
          name: OneUI9-Home-and-HomeUp-APKs
          path: |
            oneuihome/build/outputs/apk/debug/*.apk
            homeup/build/outputs/apk/debug/*.apk
